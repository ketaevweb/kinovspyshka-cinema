# ============================================================================
# КиноВспышка — Reverse Proxy (Caddy) на российском VPS
# ----------------------------------------------------------------------------
# Запуск: docker compose up -d
# Логи:   docker compose logs -f
# Стоп:   docker compose down
# ============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: kino-proxy
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP → Let's Encrypt challenge + редирект на HTTPS
      - "443:443"   # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC) — ускоряет загрузку на мобильной сети
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # SSL-сертификаты (НЕ удалять!)
      - caddy_config:/config
    environment:
      - ACME_AGREE=true             # Автосогласие с Let's Encrypt ToS
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
